[workspace]
members = [
    "crates/core",
    "crates/extractor",
    "crates/cli",
    "crates/web",
    "workers/core",
    "workers/sdk-proxy",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.98"
dotscope = "0.8.3"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
semver = "1.0.23"
base64 = "0.22.1"
hex = "0.4.3"
sha2 = "0.10.9"
thiserror = "2.0.12"
wasm-bindgen = "0.2.100"
web-sys = "0.3.77"
leptos = { version = "0.8.5", features = ["csr"] }
console_error_panic_hook = "0.1.7"
js-sys = "0.3.77"
wasm-bindgen-futures = "0.4.50"
gloo-net = "0.6.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
worker = "0.8.5"
